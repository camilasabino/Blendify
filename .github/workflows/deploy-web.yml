name: Deploy Web

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:web
        env:
          VITE_API_URL: https://api.blendify.camilasabino.dev
          VITE_AI_CREATION_ENABLED: 'true'

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy --config apps/web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test production
        run: |
          status=$(curl -fsS -o /dev/null -w '%{http_code}' \
            --retry 5 \
            --retry-delay 3 \
            --retry-connrefused \
            https://blendify.camilasabino.dev)

          if [ "$status" != "200" ]; then
            echo "Unexpected response status: $status" >&2
            exit 1
          fi