sonar.projectKey=camilasabino_Blendify
sonar.organization=camilasabino
sonar.host.url=https://sonarcloud.io

sonar.sources=apps/api/src,apps/web/src,packages/contracts/src
sonar.tests=apps/api/src,apps/web/src,packages/contracts/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/dist/**,**/coverage/**
# Bootstrap, Nest wiring, HTTP adapters, and UI shells are covered by CI/e2e intent;
# unit LCOV focuses on domain + application logic for a meaningful new-code %.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/api/src/main.ts,\
  apps/api/src/app.module.ts,\
  apps/api/src/modules/**,\
  apps/api/src/infrastructure/persistence/**,\
  apps/api/src/infrastructure/http/**,\
  apps/api/src/infrastructure/lastfm/lastfm.client.ts,\
  apps/api/src/infrastructure/spotify/spotify-api.client.ts,\
  apps/api/src/infrastructure/spotify/spotify-auth.client.ts,\
  apps/api/src/infrastructure/spotify/spotify-catalog.client.ts,\
  apps/api/src/infrastructure/spotify/spotify-music.provider.ts,\
  apps/api/src/infrastructure/spotify/spotify-playback.client.ts,\
  apps/api/src/infrastructure/spotify/spotify-playlist.client.ts,\
  apps/api/src/application/use-cases/discover-playlist.use-case.ts,\
  apps/api/src/application/use-cases/generate-playlist.use-case.ts,\
  apps/api/src/application/use-cases/generate-genre-playlist.use-case.ts,\
  apps/api/src/application/use-cases/bulk-library.use-case.ts,\
  apps/api/src/application/use-cases/control-playback.use-case.ts,\
  apps/api/src/application/services/genre-track-catalog.service.ts,\
  apps/api/src/application/services/genre-catalog.service.ts,\
  apps/api/src/infrastructure/auth/auth.service.ts,\
  apps/api/src/infrastructure/auth/jwt.strategy.ts,\
  apps/api/src/infrastructure/auth/jwt-auth.guard.ts,\
  apps/api/src/infrastructure/auth/spotify-token.service.ts,\
  apps/api/src/infrastructure/cache/redis-cache.service.ts,\
  apps/api/src/infrastructure/spotify/spotify-quota-guard.ts,\
  apps/api/src/infrastructure/spotify/spotify-quota.service.ts,\
  apps/api/src/infrastructure/spotify/spotify-rate-limit.ts,\
  apps/api/src/presentation/**,\
  apps/web/src/main.tsx,\
  apps/web/src/App.tsx,\
  apps/web/src/pages/**,\
  apps/web/src/components/**,\
  apps/web/src/hooks/**,\
  apps/web/src/stores/**,\
  apps/web/src/i18n/**,\
  apps/web/src/lib/api.ts,\
  apps/web/src/lib/api-error.ts,\
  apps/web/src/lib/playlist-cover.ts,\
  apps/web/src/lib/persist-to-library-preference.ts,\
  apps/web/src/lib/generation-stream.ts
sonar.cpd.exclusions=**/i18n/locales/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
# Fail the CI job when the Quality Gate is red (after Automatic Analysis is off).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
